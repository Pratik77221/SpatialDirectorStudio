<!doctype html><html><body><template>

  <script>
    const tl = gsap.timeline({ paused: true }); tl.fromTo("#glow-10", { opacity: 0, scale: .84 }, { opacity: .27, scale: 1, duration: 1.15, ease: "power2.out" }, .25);
